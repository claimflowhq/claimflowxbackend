components:
  schemas:
    CategoryEnum:
      enum:
      - HEALTH
      - AUTO
      - PROPERTY
      - LIFE
      - TRAVEL
      type: string
      description: |-
        * `HEALTH` - Health Insurance
        * `AUTO` - Automobile Insurance
        * `PROPERTY` - Property & Casualty
        * `LIFE` - Life Insurance
        * `TRAVEL` - Travel Insurance
    Claim:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        claim_reference:
          type: string
          readOnly: true
          description: Unique verifiable reference for claim
        claimant:
          type: integer
          readOnly: true
        claimant_username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        claimant_wallet:
          type: string
          nullable: true
          description: Stellar Testnet public key (e.g. G...)
          readOnly: true
        policy:
          type: integer
        policy_number:
          type: string
          readOnly: true
        policy_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Maximum coverage limit in USDC equivalent
          readOnly: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        incident_description:
          type: string
        incident_date:
          type: string
          format: date
        requested_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Requested compensation amount in USDC equivalent
        approved_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Approved compensation amount determined by reviewer
        authorized_payout_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Payout amount authorized on Soroban smart contract
        status:
          allOf:
          - $ref: '#/components/schemas/ClaimStatusEnum'
          readOnly: true
        assigned_reviewer:
          type: integer
          readOnly: true
          nullable: true
        assigned_reviewer_username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          readOnly: true
        on_chain_status:
          allOf:
          - $ref: '#/components/schemas/OnChainStatusEnum'
          readOnly: true
        on_chain_tx_hash:
          type: string
          readOnly: true
          nullable: true
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/SupportingEvidence'
          readOnly: true
        payout_authorization:
          allOf:
          - $ref: '#/components/schemas/PayoutAuthorization'
          readOnly: true
        review_decisions:
          type: array
          items:
            $ref: '#/components/schemas/ClaimReviewDecision'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_amount
      - assigned_reviewer
      - assigned_reviewer_username
      - authorized_payout_amount
      - claim_reference
      - claimant
      - claimant_username
      - claimant_wallet
      - created_at
      - evidence
      - id
      - incident_date
      - incident_description
      - on_chain_status
      - on_chain_tx_hash
      - payout_authorization
      - policy
      - policy_limit
      - policy_number
      - requested_amount
      - review_decisions
      - status
      - updated_at
