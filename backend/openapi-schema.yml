openapi: 3.0.3
info:
  title: ClaimFlow Insurance & Soroban Settlement API
  version: 1.0.0
  description: Enterprise Insurance Claims Management Platform powered by Stellar
    Soroban smart contracts. Enables claim submission, role-based review workflow,
    on-chain state verification, payout authorization, and testnet transaction monitoring.
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Authenticates username and password, returning JWT access and refresh
        tokens along with user profile.
      summary: User Login (JWT)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: v1_auth_me_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/blockchain/claims/{claim_reference}/:
    get:
      operationId: v1_blockchain_claims_retrieve
      description: Reads verified claim state directly from the Soroban smart contract.
      summary: Query verified claim on-chain state
      parameters:
      - in: path
        name: claim_reference
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnChainClaim'
          description: ''
  /api/v1/blockchain/contract-info/:
    get:
      operationId: v1_blockchain_contract_info_retrieve
      description: Retrieve deployed Soroban contract address, RPC URL, and network
        configuration.
      summary: Soroban contract details
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractInfo'
          description: ''
  /api/v1/blockchain/transactions/:
    get:
      operationId: v1_blockchain_transactions_list
      description: Retrieve recorded blockchain transactions, hashes, ledger sequences,
        and explorer links.
      summary: List Stellar & Soroban transactions
      parameters:
      - in: query
        name: claim_reference
        schema:
          type: string
      - in: query
        name: network
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - FAILED
          - PENDING
          - SUCCESSFUL
        description: |-
          * `PENDING` - Pending
          * `SUCCESSFUL` - Successful
          * `FAILED` - Failed
      - in: query
        name: tx_type
        schema:
          type: string
          enum:
          - CLAIM_APPROVAL
          - CLAIM_REGISTRATION
          - CLAIM_REJECTION
          - PAYOUT_AUTHORIZATION
          - REVIEW_ASSIGNMENT
          - SETTLEMENT
        description: |-
          * `CLAIM_REGISTRATION` - Claim Registration
          * `REVIEW_ASSIGNMENT` - Review Assignment
          * `CLAIM_APPROVAL` - Claim Approval
          * `CLAIM_REJECTION` - Claim Rejection
          * `PAYOUT_AUTHORIZATION` - Payout Authorization
          * `SETTLEMENT` - Settlement
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionRecordList'
          description: ''
  /api/v1/blockchain/transactions/{tx_hash}/:
    get:
      operationId: v1_blockchain_transactions_retrieve
      description: Look up a transaction on Stellar / Soroban and verify its status.
      summary: Verify transaction hash
      parameters:
      - in: path
        name: tx_hash
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRecord'
          description: ''
  /api/v1/claims/:
    get:
      operationId: v1_claims_list
      description: Filter claims by status, category, policy, claimant.
      summary: List insurance claims
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - AUTO
          - HEALTH
          - LIFE
          - PROPERTY
          - TRAVEL
        description: |-
          * `HEALTH` - Health Insurance
          * `AUTO` - Automobile Insurance
          * `PROPERTY` - Property & Casualty
          * `LIFE` - Life Insurance
          * `TRAVEL` - Travel Insurance
      - in: query
        name: claimant
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: policy
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - DRAFT
          - PAYOUT_AUTHORIZED
          - REJECTED
          - SETTLED
          - SUBMITTED
          - UNDER_REVIEW
        description: |-
          * `DRAFT` - Draft
          * `SUBMITTED` - Submitted
          * `UNDER_REVIEW` - Under Review
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
          * `PAYOUT_AUTHORIZED` - Payout Authorized
          * `SETTLED` - Settled
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClaimList'
          description: ''
    post:
      operationId: v1_claims_create
      description: Claimants create a claim with incident details, requested amount,
        and policy reference.
      summary: Submit a new insurance claim
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
  /api/v1/claims/{id}/:
    get:
      operationId: v1_claims_retrieve
      summary: Retrieve claim details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this claim.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
    put:
      operationId: v1_claims_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this claim.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
    patch:
      operationId: v1_claims_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this claim.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClaimRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClaimRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClaimRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
    delete:
      operationId: v1_claims_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this claim.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/claims/{id}/approve/:
    post:
      operationId: v1_claims_approve_create
      description: Authorized reviewer approves claim with an approved amount and
        decision notes, recording the approval on Soroban.
      summary: Approve claim
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this claim.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimApproveActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimApproveActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimApproveActionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
  /api/v1/claims/{id}/authorize_payout/:
    post:
      operationId: v1_claims_authorize_payout_create
      description: Authorized reviewer or admin authorizes payout for an approved
        claim. Validates amount and prevents duplicate authorization.
      summary: Authorize payout on Soroban
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this claim.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutAuthorizeActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayoutAuthorizeActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayoutAuthorizeActionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAuthorization'
          description: ''
  /api/v1/claims/{id}/evidence/:
    post:
      operationId: v1_claims_evidence_create
      description: Upload or link supporting evidence documents.
      summary: Attach supporting evidence
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this claim.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportingEvidenceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupportingEvidenceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupportingEvidenceRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportingEvidence'
          description: ''
  /api/v1/claims/{id}/reject/:
    post:
      operationId: v1_claims_reject_create
      description: Authorized reviewer rejects claim with comments, recording the
        decision on Soroban.
      summary: Reject claim
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this claim.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRejectActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimRejectActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimRejectActionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
  /api/v1/claims/{id}/review/:
    post:
      operationId: v1_claims_review_create
      description: Authorized reviewer assigns the claim and transitions status to
        Under Review on-chain.
      summary: Move claim to Under Review
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this claim.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
  /api/v1/claims/{id}/settle/:
    post:
      operationId: v1_claims_settle_create
      description: Records confirmed Stellar Testnet transaction settlement. Clearly
        distinguishes authorization from fund settlement.
      summary: Record actual settlement
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this claim.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimSettleActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimSettleActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimSettleActionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
          description: ''
  /api/v1/claims/{id}/timeline/:
    get:
      operationId: v1_claims_timeline_list
      description: Chronological audit history of state changes, reviewers, notes,
        and transaction hashes.
      summary: Claim activity history timeline
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - AUTO
          - HEALTH
          - LIFE
          - PROPERTY
          - TRAVEL
        description: |-
          * `HEALTH` - Health Insurance
          * `AUTO` - Automobile Insurance
          * `PROPERTY` - Property & Casualty
          * `LIFE` - Life Insurance
          * `TRAVEL` - Travel Insurance
      - in: query
        name: claimant
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this claim.
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: policy
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - DRAFT
          - PAYOUT_AUTHORIZED
          - REJECTED
          - SETTLED
          - SUBMITTED
          - UNDER_REVIEW
        description: |-
          * `DRAFT` - Draft
          * `SUBMITTED` - Submitted
          * `UNDER_REVIEW` - Under Review
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
          * `PAYOUT_AUTHORIZED` - Payout Authorized
          * `SETTLED` - Settled
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClaimTimelineEventList'
          description: ''
  /api/v1/claims/dashboard/metrics/:
    get:
      operationId: v1_claims_dashboard_metrics_retrieve
      description: Summary statistics across claims, states, requested vs authorized
        volumes.
      summary: Dashboard operational metrics
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'
          description: ''
  /api/v1/payouts/:
    get:
      operationId: v1_payouts_list
      description: View records of authorized payouts, on-chain transaction hashes,
        and settlement statuses.
      summary: List payout authorizations
      parameters:
      - in: query
        name: claim__category
        schema:
          type: string
          enum:
          - AUTO
          - HEALTH
          - LIFE
          - PROPERTY
          - TRAVEL
        description: |-
          * `HEALTH` - Health Insurance
          * `AUTO` - Automobile Insurance
          * `PROPERTY` - Property & Casualty
          * `LIFE` - Life Insurance
          * `TRAVEL` - Travel Insurance
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CONFIRMED
          - FAILED
          - PENDING
        description: |-
          * `PENDING` - Pending
          * `CONFIRMED` - Confirmed
          * `FAILED` - Failed
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPayoutAuthorizationList'
          description: ''
  /api/v1/payouts/{id}/:
    get:
      operationId: v1_payouts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAuthorization'
          description: ''
  /api/v1/payouts/pending-claims/:
    get:
      operationId: v1_payouts_pending_claims_list
      description: Returns list of approved claims ready for payout authorization
        on Soroban.
      summary: Approved claims awaiting payout authorization
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Claim'
          description: ''
  /api/v1/policies/:
    get:
      operationId: v1_policies_list
      description: Claimants view their own policies. Reviewers and admins view all
        policies.
      summary: List policies
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - AUTO
          - HEALTH
          - LIFE
          - PROPERTY
          - TRAVEL
        description: |-
          * `HEALTH` - Health Insurance
          * `AUTO` - Automobile Insurance
          * `PROPERTY` - Property & Casualty
          * `LIFE` - Life Insurance
          * `TRAVEL` - Travel Insurance
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPolicyList'
          description: ''
    post:
      operationId: v1_policies_create
      summary: Create a new policy (Admins/Reviewers)
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
