# Dokploy Production Docker Compose for ClaimFlow Platform
# Self-hosted PaaS deployment without Nginx (Traefik reverse proxy managed by Dokploy)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claimflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-claimflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimflow_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claimflow_user} -d ${POSTGRES_DB:-claimflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: gunicorn claimflow_core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=claimflow_core.settings
      - DJANGO_DEBUG=False
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-claimflow_db}
      - POSTGRES_USER=${POSTGRES_USER:-claimflow_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-claimflow_secret}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_MIGRATIONS=true
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-api.claimflowx.com,claimflowx.com,www.claimflowx.com}
      - STELLAR_NETWORK=${STELLAR_NETWORK:-TESTNET}
      - SOROBAN_RPC_URL=${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      - SOROBAN_CONTRACT_ID=${SOROBAN_CONTRACT_ID:-CAT66FXHT4XLULGRQ7IWFXAHBUIP2ATTS3YUXPFN2ZQILAMWPRZSBUOH}
      - SIMULATED_BLOCKCHAIN=${SIMULATED_BLOCKCHAIN:-False}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.claimflow-api.rule=Host(`${API_DOMAIN:-api.claimflowx.com}`)"
      - "traefik.http.routers.claimflow-api.entrypoints=websecure"
      - "traefik.http.routers.claimflow-api.tls=true"
      - "traefik.http.routers.claimflow-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.claimflow-api.loadbalancer.server.port=8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A claimflow_core worker -l info --concurrency=4
    volumes:
      - media_data:/app/media
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=claimflow_core.settings
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-claimflow_db}
      - POSTGRES_USER=${POSTGRES_USER:-claimflow_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-claimflow_secret}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_MIGRATIONS=false
      - STELLAR_NETWORK=${STELLAR_NETWORK:-TESTNET}
      - SOROBAN_RPC_URL=${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      - SOROBAN_CONTRACT_ID=${SOROBAN_CONTRACT_ID:-CAT66FXHT4XLULGRQ7IWFXAHBUIP2ATTS3YUXPFN2ZQILAMWPRZSBUOH}
      - SIMULATED_BLOCKCHAIN=${SIMULATED_BLOCKCHAIN:-False}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A claimflow_core beat -l info
    volumes:
      - media_data:/app/media
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=claimflow_core.settings
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-claimflow_db}
      - POSTGRES_USER=${POSTGRES_USER:-claimflow_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-claimflow_secret}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_MIGRATIONS=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  soroban_indexer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py run_soroban_event_listener
    volumes:
      - media_data:/app/media
    env_file:
      - path: .env
        required: false
    environment:
      - DJANGO_SETTINGS_MODULE=claimflow_core.settings
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-claimflow_db}
      - POSTGRES_USER=${POSTGRES_USER:-claimflow_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-claimflow_secret}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RUN_MIGRATIONS=false
      - STELLAR_NETWORK=${STELLAR_NETWORK:-TESTNET}
      - SOROBAN_RPC_URL=${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      - SOROBAN_CONTRACT_ID=${SOROBAN_CONTRACT_ID:-CAT66FXHT4XLULGRQ7IWFXAHBUIP2ATTS3YUXPFN2ZQILAMWPRZSBUOH}
      - SIMULATED_BLOCKCHAIN=${SIMULATED_BLOCKCHAIN:-False}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge

