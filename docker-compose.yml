services:
  db:
    image: postgres:16-alpine
    container_name: claimflow_db
    environment:
      POSTGRES_DB: ${DB_NAME:-claimflow_db}
      POSTGRES_USER: ${DB_USER:-claimflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-claimflow_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-claimflow_user} -d ${DB_NAME:-claimflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - claimflow_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: claimflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - claimflow_network
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimflow_web
    command: gunicorn claimflow_core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-claimflow-super-secret-key-production-ready-2026!#$*}
      - DB_NAME=${DB_NAME:-claimflow_db}
      - DB_USER=${DB_USER:-claimflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-claimflow_password}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STELLAR_NETWORK=${STELLAR_NETWORK:-TESTNET}
      - SOROBAN_RPC_URL=${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      - SOROBAN_CONTRACT_ID=${SOROBAN_CONTRACT_ID:-CAT66FXHT4XLULGRQ7IWFXAHBUIP2ATTS3YUXPFN2ZQILAMWPRZSBUOH}
      - STELLAR_ADMIN_PUBLIC_KEY=${STELLAR_ADMIN_PUBLIC_KEY:-GAF7L3F5VJDN4ZE2AHNLE4LVI5HP36UOG4IBZZUXBXJIWGL66K3CIPQK}
      - SIMULATED_BLOCKCHAIN=${SIMULATED_BLOCKCHAIN:-True}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - claimflow_network
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimflow_celery_worker
    command: celery -A claimflow_core worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-claimflow-super-secret-key-production-ready-2026!#$*}
      - DB_NAME=${DB_NAME:-claimflow_db}
      - DB_USER=${DB_USER:-claimflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-claimflow_password}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STELLAR_NETWORK=${STELLAR_NETWORK:-TESTNET}
      - SOROBAN_RPC_URL=${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      - SOROBAN_CONTRACT_ID=${SOROBAN_CONTRACT_ID:-CAT66FXHT4XLULGRQ7IWFXAHBUIP2ATTS3YUXPFN2ZQILAMWPRZSBUOH}
      - STELLAR_ADMIN_PUBLIC_KEY=${STELLAR_ADMIN_PUBLIC_KEY:-GAF7L3F5VJDN4ZE2AHNLE4LVI5HP36UOG4IBZZUXBXJIWGL66K3CIPQK}
      - SIMULATED_BLOCKCHAIN=${SIMULATED_BLOCKCHAIN:-True}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - claimflow_network
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimflow_celery_beat
    command: celery -A claimflow_core beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-claimflow-super-secret-key-production-ready-2026!#$*}
      - DB_NAME=${DB_NAME:-claimflow_db}
      - DB_USER=${DB_USER:-claimflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-claimflow_password}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - claimflow_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  claimflow_network:
    driver: bridge

